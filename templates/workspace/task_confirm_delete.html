{% extends "app.html" %}

{% block title %}Excluir tarefa · FlowTask{% endblock %}
{% block page_title %}Excluir tarefa{% endblock %}

{% block content %}
<div class="panel" style="max-width: 32rem;">
  <h2>Excluir “{{ object.title }}”?</h2>
  <p style="color: var(--color-text-muted);">Checklist e comentários também serão removidos.</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ back_url }}">
    <div style="display: flex; gap: 0.75rem;">
      <button type="submit" class="btn btn--danger">Confirmar exclusão</button>
      <a class="btn btn--secondary" href="{% url 'workspace:task_detail' object.pk %}?next={{ back_url|urlencode }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
